# DeskBridge client config (Deskflow) - managed by DeskBridge
# Installed to ~/.config/Deskflow/Deskflow.conf by src/deskbridge (setup/repair)
[core]
computerName=fedora
coreMode=1
port=24800
preventSleep=false

[client]
# Server PC address (replace with yours, or just run: ./src/deskbridge setup)
remoteHost=192.168.1.10

[security]
tlsEnabled=true
checkPeerFingerprints=true
keySize=2048

[gui]
startCoreWithGui=true
closeToTray=true
autoHide=false
enableUpdateCheck=false
