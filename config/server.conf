[core]
computerName=windows
coreMode=2
processMode=1
port=24800
preventSleep=false

[computer_windows]
name=windows

[computer_fedora]
name=fedora

[server]
externalConfig=true
externalConfigFile=C:/ProgramData/Deskflow/server.config
enableClipboard=true
switchDelay=250

[security]
tlsEnabled=true
checkPeerFingerprints=true
keySize=2048

[gui]
startCoreWithGui=true
closeToTray=true
autoHide=false
enableUpdateCheck=false
